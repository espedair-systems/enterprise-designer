# IBM DataStage & Control-M Project Profile Configuration
profile: DataStageETL
allowed_extensions:
  - isx
  - xml
  - dsx
  - ctm
  - sh
  - bash
  - sql
  - pls
  - plsql
  - pks
  - pkb
watch_directories:
  - jobs/
  - schedules/
  - scripts/
  - sql/
model_name: nomic-embed-text-v1.5
model_path: ~/.mcp-ag/models/nomic-embed-text-v1.5/model.onnx
tokenizer_path: ~/.mcp-ag/models/nomic-embed-text-v1.5/tokenizer.json
db_path: ~/.mcp-ag/data/local_artifacts_lancedb
dimension: Full768
watch_dir: .
log_level: info
